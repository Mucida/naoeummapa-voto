name: votar
on:
  schedule:
    - cron: '5,35 * * * *'   # UTC; 2 tentativas por hora, o horario do GitHub atrasa as vezes
  workflow_dispatch:
jobs:
  votar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: ./votar.sh
        env:
          EU: lucasmucida
          VOTO_SID: ${{ secrets.VOTO_SID }}
