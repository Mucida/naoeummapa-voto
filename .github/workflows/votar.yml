name: votar
on:
  workflow_dispatch:       # disparado a cada 15 min pelo cron-job.org; o schedule do GitHub falhava horas seguidas
permissions:
  contents: write          # para guardar ultimo.txt
concurrency:
  group: votar             # uma rodada por vez; a seguinte espera e le o ultimo.txt atualizado
  cancel-in-progress: false
jobs:
  votar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ./votar.sh
        env:
          EU: lucasmucida
          VOTO_SID: ${{ secrets.VOTO_SID }}
      - name: guarda a hora do voto
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ultimo.txt
          git diff --cached --quiet || { git commit -q -m "voto $(TZ=America/Sao_Paulo date '+%F %H:%M')" && git push -q; }
